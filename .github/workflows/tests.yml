# Runs on every push and pull request: the page must be what src/ builds, the rules must pass, and the fast browser
# suites must find nothing. Each script exits 1 when it finds a problem.
name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source is formatted (Prettier, settings in .prettierrc)
        run: npx --yes prettier@3.10.1 --check "src/*.js" "src/*.css"
      - name: index.html is what src/ builds
        run: python3 build.py && git diff --exit-code index.html
      - name: Rules
        run: node test/rules.js
      - name: Pacing (a simulated player, fixed seed, must reach each level inside its bounds)
        run: node test/pace.js 4 casco 8
      - name: Browser suites (the runner's own Chrome)
        run: |
          pip install playwright
          which google-chrome
          python3 test/tutorial.py 386x630x3
          python3 test/tutorial.py 1280x720x1
          python3 test/lessons.py 386x630x3
          python3 test/depth.py 386x630x3
          python3 test/vip.py 386x630x3
          python3 test/offline.py
          python3 test/home.py 386x630x3
          python3 test/home.py 1280x720x1
          python3 test/fleet.py 1280x720x1
          python3 test/fleet.py 386x630x3
          python3 test/tips.py 386x630x3
          python3 test/tips.py 1280x720x1
          python3 test/overlays.py 386x630x3
          python3 test/overlays.py 1280x720x1
          python3 test/audit.py 386x630x3 393x759x3 462x904x3 1280x720x1
          python3 test/bigphone.py
