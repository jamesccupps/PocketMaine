<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "VideoGame",
 "name": "Pocket Maine - Air and Sea",
 "alternateName": "Pocket Maine",
 "url": "https://jamesccupps.github.io/PocketMaine/",
 "description": "A pixel-art Maine transport tycoon for the browser. Bush planes, floatplanes, ferries and lobster boats carry passengers and freight between 54 ports from Maine across New England, with fishing, weather, seasons, hangars and boatyards, and levels that unlock new things to do. No timers to wait out, nothing to buy.",
 "genre": [
  "Tycoon",
  "Simulation"
 ],
 "gamePlatform": "Web browser",
 "applicationCategory": "Game",
 "operatingSystem": "Any (web browser)",
 "playMode": "SinglePlayer",
 "inLanguage": "en",
 "image": "https://jamesccupps.github.io/PocketMaine/docs/social.png",
 "screenshot": "https://jamesccupps.github.io/PocketMaine/docs/desktop-port.png",
 "author": {
  "@type": "Person",
  "name": "James Cupps",
  "url": "https://jamesccupps.github.io/"
 },
 "sameAs": "https://github.com/jamesccupps/PocketMaine",
 "license": "https://opensource.org/licenses/MIT",
 "offers": {
  "@type": "Offer",
  "price": "0",
  "priceCurrency": "USD"
 }
}
</script>
<style>
/*FONTS*/
/*CSS*/
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="logo"><b>POCKET MAINE</b><i>AIR AND SEA</i></div>
    <div class="hudbox" id="moneybox" data-tip="Cash on hand. Fuel is on account, so this can dip below zero."><img id="coinic" alt=""><span id="money">$0</span></div>
    <div class="hudbox" id="lvlbox" data-act="levels" style="cursor:pointer" data-tip="XP comes from fares, catches, contracts, new ports and firsts. Each level unlocks something: tap to see what is next."><b id="lvl">LV 1</b><div id="xpwrap"><div id="xptxt"></div><div id="xpbar"><i id="xpfill"></i></div></div></div>
    <div class="hudbox" id="datebox" data-tip="Real time: a day is five minutes, a season is seven days. The clock keeps running while the game is closed."><img id="seasonic" alt=""><div><div id="date"></div><div id="daybar"><i id="dayfill"></i></div></div></div>
    <div class="spacer"></div>
    <button class="hbtn big" id="landbtn" data-act="nextIdle" data-tip="Jump to the next craft that needs you (Tab)">0 IDLE</button>
    <button class="hbtn" id="sndbtn" data-act="sound" data-tip="Sound on/off" aria-label="Sound on or off">&#9835;</button>
    <button class="hbtn" data-act="help" data-tip="About the game" aria-label="About the game">?</button>
  </header>
  <div id="stage">
    <div id="mapwrap">
      <canvas id="map" role="img" aria-label="Map of your ports and craft"></canvas>
      <div id="zoom"><button class="hbtn" data-act="zin" data-tip="Zoom in" aria-label="Zoom in">+</button><button class="hbtn" data-act="zout" data-tip="Zoom out" aria-label="Zoom out">&minus;</button><button class="hbtn" data-act="zhome" data-tip="Back to your home waters" aria-label="Back to your home waters">ME</button></div>
      <div id="bevmap"></div>
      <div id="banner"></div>
      <div id="toasts" role="status" aria-live="polite"></div>
      <div id="catchup" role="status" aria-live="polite"><div class="cubox"><b>CATCHING UP</b><span id="catchtxt"></span><div class="bar"><i id="catchbar"></i></div></div></div>
    </div>
    <div id="sheetwrap">
      <div id="sheet">
        <div id="shead"></div>
        <div id="scols">
          <div id="sleft"><div id="scenebox"><canvas id="scene" width="184" height="70"></canvas><div id="splash"></div></div><div id="lbody"></div></div>
          <div id="sright"><div id="stabs"></div><div id="sbody"></div></div>
        </div>
        <div id="sfoot"></div>
      </div>
    </div>
  </div>
  <div id="dock">
    <div id="fleet"></div>
    <div id="routebar"></div>
    <div id="menu">
      <button class="mbtn" data-act="menu" data-arg="contracts" data-tip="Seasonal contracts"><img id="mi1" alt=""><span id="mk">CONTRACTS</span></button>
      <button class="mbtn" data-act="menu" data-arg="yard" data-tip="Hangars, boatyards, parts and storage"><img id="mi4" alt=""><span id="my">HANGAR</span></button>
      <button class="mbtn" data-act="menu" data-arg="market" data-tip="Fish market prices"><img id="mi2" alt=""><span>FISH</span></button>
      <button class="mbtn" data-act="menu" data-arg="almanac" data-tip="Season, weather, how to play, the books"><img id="mi3" alt=""><span>ALMANAC</span></button>
    </div>
  </div>
  <footer id="ticker"><b>THE DOORYARD DISPATCH</b><img id="tface" alt=""><span id="tmsg" aria-live="off"><span id="tmi"></span></span></footer>
</div>
<div id="tip"></div>
<div id="coach" role="status" aria-live="polite"><div id="coachring"></div><div id="coachbub"></div></div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Pocket Maine"><div id="mbox"></div></div>
<script>
/*JS*/
</script>
</body>
</html>
