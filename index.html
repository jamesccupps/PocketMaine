:root{--navy:#14273d;--navy2:#1f3550;--navy3:#2b4666;--deep:#0b1726;--cream:#fff3d6;--paper:#f6e9c8;--paper2:#eadbb2;--paper3:#d9c796;--ink:#1b2533;--red:#c8402f;--redd:#8f2a22;--green:#3f8f3a;--greend:#2a5f30;--yellow:#ffd23f;--yellowd:#c99a1c;--blue:#3f7fc8;--blued:#1f3f78;--sky:#8fd8ee;--gray:#8a8f98;--orange:#f07a18}
*{box-sizing:border-box}
html,body{touch-action:manipulation;margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:'VT323',ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;font-size:22px;line-height:1;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
img,canvas{image-rendering:pixelated}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
b,strong{font-weight:400}
.sk,h2,h3{font-family:'Silkscreen','VT323',monospace;text-transform:uppercase}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
/* ---------- HUD ---------- */
#hud{display:flex;align-items:center;gap:12px;height:60px;flex:0 0 60px;padding:0 14px;background:var(--navy);border-bottom:4px solid var(--deep);color:var(--cream)}
#logo{display:flex;flex-direction:column;line-height:1}
#logo b{font-family:'Silkscreen',monospace;font-size:24px;color:var(--yellow);text-shadow:3px 3px 0 var(--redd);font-weight:700}
#logo i{font-family:'Silkscreen',monospace;font-size:10px;font-style:normal;color:var(--sky);margin-top:2px;letter-spacing:6px}
.hudbox{display:flex;align-items:center;gap:9px;background:var(--navy2);border:3px solid var(--deep);padding:4px 12px;height:44px;box-shadow:inset 3px 3px 0 var(--navy3)}
#coinic{width:24px;height:24px}#seasonic{width:24px;height:24px}
#money{font-family:'Silkscreen',monospace;font-size:24px;color:var(--yellow);min-width:104px}
#money.neg{color:#ff8a7a}
#lvl{font-family:'Silkscreen',monospace;font-size:20px;color:var(--yellow);font-weight:700;white-space:nowrap}
#xptxt{font-family:'Silkscreen',monospace;font-size:10px;color:var(--sky);white-space:nowrap}
#xpbar{width:120px;height:8px;background:var(--deep);margin-top:3px}#xpbar i{display:block;height:100%;background:#6fd06a;width:0}
#date{font-family:'Silkscreen',monospace;font-size:12px;line-height:1.25;white-space:nowrap}
#date small{display:block;color:var(--sky);font-size:10px}
#daybar{width:100%;height:5px;background:var(--deep);position:relative;margin-top:2px}#daybar i{position:absolute;left:0;top:0;bottom:0;background:var(--yellow)}
.spacer{flex:1}
.hbtn{font-family:'Silkscreen',monospace;font-size:14px;height:44px;min-width:44px;padding:0 10px;background:var(--navy2);color:var(--cream);border:3px solid var(--deep);box-shadow:inset 3px 3px 0 var(--navy3),inset -3px -3px 0 #132337}
.hbtn:hover{background:var(--navy3)}.hbtn.on{background:var(--yellow);color:var(--ink);box-shadow:inset 3px 3px 0 #fff3b0,inset -3px -3px 0 var(--yellowd)}
.hbtn.big{font-size:14px;padding:0 16px}
#landbtn.hot{background:var(--green);color:#fff;box-shadow:inset 3px 3px 0 #6fc46a,inset -3px -3px 0 var(--greend);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
/* ---------- stage + map ---------- */
#stage{flex:1;position:relative;min-height:0}
#mapwrap{position:absolute;inset:0;overflow:hidden;background:#0e1c2e;cursor:grab;touch-action:none}
#mapwrap.drag{cursor:grabbing}#mapwrap.pick{cursor:pointer}
#map{position:absolute;left:0;top:0;display:block}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:5px;z-index:3}
#zoom .hbtn{width:44px;font-size:16px;padding:0}
#banner{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:30;pointer-events:none;text-align:center;opacity:0;width:max-content;max-width:92%}
#banner.show{animation:ban 4.2s ease-out}
#banner b{display:block;font-family:'Silkscreen',monospace;font-size:54px;color:var(--cream);text-shadow:5px 5px 0 var(--navy),-3px -3px 0 var(--navy),3px -3px 0 var(--navy),-3px 3px 0 var(--navy)}
#banner span{display:inline-block;margin-top:8px;background:var(--navy);color:var(--cream);padding:8px 14px;max-width:560px;border:4px solid var(--deep);font-size:24px}
@keyframes ban{0%{opacity:0;transform:translate(-50%,10px)}8%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
#toasts{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:31;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:90%}
.toast{background:var(--navy);color:var(--cream);border:4px solid var(--deep);padding:8px 14px;box-shadow:4px 4px 0 rgba(0,0,0,.35);animation:tin .18s steps(3);font-size:22px}
.toast.bad{background:var(--redd)}.toast.good{background:var(--greend)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--navy);color:var(--cream);border:3px solid var(--deep);padding:7px 10px;max-width:320px;font-size:20px;box-shadow:4px 4px 0 rgba(0,0,0,.35);display:none;white-space:pre-line}
#tip b{color:var(--yellow)}
#bevmap{position:absolute;left:12px;top:12px;z-index:3;max-width:min(460px,calc(100% - 80px));pointer-events:none}
.bev{display:flex;gap:12px;align-items:center;background:#fffaf0;border:4px solid var(--ink);padding:9px 12px;box-shadow:4px 4px 0 rgba(0,0,0,.3);font-size:22px;line-height:1.05}
.bev img{width:48px;height:48px;flex:0 0 48px;border:3px solid var(--ink);background:var(--sky)}
.bev b{font-family:'Silkscreen',monospace;font-size:10px;display:block;color:var(--redd);margin-bottom:3px}
.steps{display:flex;gap:4px;margin-top:6px}.steps i{width:18px;height:7px;background:var(--paper3);border:2px solid var(--ink)}.steps i.d{background:var(--green)}.steps i.c{background:var(--yellow)}
/* ---------- the port screen (sheet) ---------- */
#sheetwrap{position:absolute;inset:0;z-index:10;display:none;justify-content:center;align-items:stretch;background:rgba(8,16,28,.62);padding:10px}
#sheetwrap.show{display:flex}
#sheet{width:1180px;max-width:100%;display:flex;flex-direction:column;background:var(--paper);border:4px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.45);min-height:0;animation:rise .16s steps(4)}
#sheet.single{width:780px}
@keyframes rise{from{transform:translateY(18px);opacity:.3}}
#scols{flex:1;display:flex;min-height:0}
#sleft{flex:0 0 552px;display:flex;flex-direction:column;border-right:4px solid var(--ink);min-height:0;overflow-y:auto;background:var(--paper2);scrollbar-width:thin}
#sheet.single #sleft{display:none}
#lbody{padding:10px 12px 12px}
#sright{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#shead{flex:0 0 auto;display:flex;align-items:center;gap:10px;background:var(--navy);color:var(--cream);padding:8px 10px;min-height:54px}
#shead h2{font-size:22px;margin:0;font-weight:700;color:var(--yellow);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shead .sub2{font-size:20px;color:var(--sky);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shead .grow{flex:1;min-width:0}
#shead .reft{font-family:'Silkscreen',monospace;font-size:10px;color:var(--sky);text-align:right;white-space:nowrap;line-height:1.4}
#shead .reft b{display:block;font-size:16px;color:var(--cream)}
#scenebox{flex:0 0 210px;position:relative;height:210px;background:#6fbdf0;border-bottom:4px solid var(--ink);overflow:hidden}
#scene{display:block;width:100%;height:100%;object-fit:cover}
#splash{position:absolute;inset:0;pointer-events:none;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#splash.show{display:flex;animation:spl 2.4s ease-out forwards}
#splash b{font-family:'Silkscreen',monospace;font-size:56px;color:var(--yellow);font-weight:700;text-shadow:5px 5px 0 var(--navy),-3px -3px 0 var(--navy),3px -3px 0 var(--navy),-3px 3px 0 var(--navy)}
#splash span{background:var(--navy);color:var(--cream);border:3px solid var(--deep);padding:4px 10px;margin-top:6px;font-size:22px}
#splash i{position:absolute;top:-30px;width:32px;height:32px;background-size:32px 32px;animation:coinfall 1.5s linear forwards}
@keyframes spl{0%{opacity:0;transform:scale(.6)}10%{opacity:1;transform:scale(1.08)}18%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes coinfall{to{transform:translateY(340px) rotate(40deg)}}
#stabs{flex:0 0 auto;display:flex;gap:4px;background:var(--navy2);padding:8px 8px 0;border-bottom:0}
.stab{font-family:'Silkscreen',monospace;font-size:14px;padding:9px 16px 8px;background:var(--navy);color:var(--sky);border:3px solid var(--deep);border-bottom:none}
.stab.on{background:var(--paper);color:var(--ink)}.stab:hover{color:#fff}.stab.on:hover{color:var(--ink)}
#sbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 14px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--paper3) var(--paper)}
#sfoot{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--paper2);border-top:4px solid var(--ink)}
#sfoot:empty{display:none}
#sfoot .grow{flex:1;min-width:0;font-size:22px;line-height:1.05}
h3{font-size:12px;margin:14px 0 7px;color:#5a4a2a;font-weight:400;display:flex;align-items:center;gap:8px}
h3::after{content:'';flex:1;height:3px;background:var(--paper3)}
h3 em{font-style:normal;color:var(--ink)}
h3:first-child{margin-top:2px}
.sub{color:#5a5340;font-size:21px;line-height:1.05}.sub b{color:var(--ink)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pip{width:11px;height:11px;border:2px solid var(--ink);display:inline-block}.pip.s2{background:#9aa3ad}.pip.s1{background:#c89a5a}.pip.sea{background:#4f9be0}.pip.lake{background:#8fe0f0}
#shead .pip{border-color:var(--deep)}
.tag{display:inline-block;font-family:'Silkscreen',monospace;font-size:10px;padding:3px 7px;border:2px solid var(--ink);background:var(--paper2);white-space:nowrap;color:var(--ink)}
.tag.red{background:var(--red);color:#fff}.tag.green{background:var(--green);color:#fff}.tag.blue{background:var(--blue);color:#fff}.tag.yel{background:var(--yellow)}.tag.org{background:var(--orange);color:#fff}
.btn{font-family:'Silkscreen',monospace;font-size:13px;padding:10px 14px;background:var(--yellow);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 var(--yellowd),inset 3px 3px 0 #fff3b0;white-space:nowrap;color:var(--ink);line-height:1}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translate(2px,2px);box-shadow:inset 3px 3px 0 var(--yellowd)}
.btn.sm{font-size:10px;padding:7px 9px}
.btn.big{font-size:22px;padding:13px 26px;border-width:4px;font-weight:700}
.btn.go{background:var(--green);color:#fff;box-shadow:inset -4px -4px 0 var(--greend),inset 4px 4px 0 #6fc46a}
.btn.red{background:var(--red);color:#fff;box-shadow:inset -3px -3px 0 var(--redd),inset 3px 3px 0 #e8705f}
.btn.blue{background:var(--blue);color:#fff;box-shadow:inset -3px -3px 0 var(--blued),inset 3px 3px 0 #7fb0e8}
.btn.plain{background:var(--paper);box-shadow:inset -3px -3px 0 var(--paper3),inset 3px 3px 0 #fffaf0}
.btn.dark{background:var(--navy2);color:var(--cream);border-color:var(--deep);box-shadow:inset -3px -3px 0 #132337,inset 3px 3px 0 var(--navy3)}
.btn[disabled]{background:#cfc5a8;color:#8a8168;box-shadow:inset -3px -3px 0 #b8ad8c;cursor:not-allowed;filter:none}
.card{background:#fffaf0;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--paper3);padding:10px 12px;margin:10px 0}
.bar{height:12px;background:var(--paper3);border:3px solid var(--ink);position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--green)}.bar.blue i{background:var(--blue)}
.bar.tall{height:22px}
/* craft at this port */
.craftbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:thin}
.cchip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;background:#fffaf0;border:3px solid var(--ink);box-shadow:inset -3px -3px 0 var(--paper3);min-height:46px}
.cchip img{width:auto;height:auto;max-width:60px}
.cchip b{font-family:'Silkscreen',monospace;font-size:11px;display:block}.cchip span{font-size:19px;color:#5a5340;display:block}
.cchip.on{background:var(--yellow);box-shadow:inset -3px -3px 0 var(--yellowd)}
.cchip:hover{filter:brightness(1.05)}
/* the hold */
.holdbar{background:var(--navy2);border:3px solid var(--ink);padding:9px 10px;color:var(--cream);box-shadow:4px 4px 0 var(--paper3)}
.holdbar .hh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.holdbar .hh>div{flex:1;min-width:0}.holdbar .hh b{font-family:'Silkscreen',monospace;font-size:15px;color:var(--yellow);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.holdbar .hh span{font-size:20px;color:var(--sky);display:block;margin-top:2px}
.holdbar .bn{font-size:21px;margin-top:7px;color:var(--sky)}.holdbar .bn.on{color:#7dff8a}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:54px;height:62px;border:3px solid var(--deep);background:#2f4c70;padding:0;position:relative;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.slot img{width:40px;height:40px;margin-top:3px}
.slot.empty img{opacity:.35}.slot.empty{cursor:default}.slot.c.empty{border-style:dashed}
.slot.full{background:#fffaf0}
button.slot.full:hover{background:#ffd9cf}
.slot span{font-family:'Silkscreen',monospace;font-size:10px;line-height:1;position:absolute;bottom:3px;left:0;right:0;text-align:center}
.slot.bonus{outline:3px solid #6fd06a;outline-offset:-6px}
/* destination filter chips */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 8px}
.fchip{font-family:'Silkscreen',monospace;font-size:11px;padding:7px 9px;border:3px solid var(--ink);background:#fffaf0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.fchip:hover{background:#fff}.fchip.on{background:var(--yellow)}
.fchip.no{color:#8a8168;background:var(--paper2)}.fchip i{font-style:normal;background:var(--ink);color:#fff;padding:1px 5px;font-size:10px}
.fchip.ok::before{content:'';width:9px;height:9px;background:var(--green);border:2px solid var(--ink)}
.fchip.no::before{content:'';width:9px;height:9px;background:var(--red);border:2px solid var(--ink)}
.filters .right{margin-left:auto}
/* job rows */
.rows{display:flex;flex-direction:column;gap:6px}
.jrow{display:flex;align-items:center;gap:12px;background:#fffaf0;border:3px solid var(--ink);padding:6px 8px 6px 8px;box-shadow:3px 3px 0 var(--paper3);min-height:60px}
.jrow.c{background:#f7efda}
.jrow.aboard{background:#dbe9f7}
.jrow.k{background:#ffe9a8}
.jrow.no .jic,.jrow.no .jtx{opacity:.55}
.jic{width:40px;height:40px;flex:0 0 40px}
.jtx{flex:1;min-width:0}
.jtx b{display:block;font-size:24px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jtx>span{display:flex;align-items:center;gap:6px;font-size:20px;color:#5a5340;margin-top:3px;white-space:nowrap;overflow:hidden}
.jtx em{font-style:normal;font-family:'Silkscreen',monospace;font-size:11px;color:var(--ink);background:var(--paper2);border:2px solid var(--ink);padding:2px 5px}
.jtx em.ok{background:#cfeec2}.jtx em.no{background:#f3c9c0}
.jtx .why{color:var(--red)}
.jpay{font-family:'Silkscreen',monospace;font-size:18px;color:var(--greend);white-space:nowrap;text-align:right;min-width:64px}
.jpay small{display:block;font-size:10px;color:#5a5340}
.jrow .btn{min-width:84px;text-align:center}
.jrow .btn.load{background:var(--green);color:#fff;box-shadow:inset -3px -3px 0 var(--greend),inset 3px 3px 0 #6fc46a}
.jrow .btn.load[disabled]{background:#cfc5a8;color:#8a8168;box-shadow:inset -3px -3px 0 #b8ad8c}
.jcount{font-family:'Silkscreen',monospace;font-size:12px;background:var(--ink);color:#fff;padding:2px 6px}
/* lists used on info tabs and menus */
.lst{display:flex;flex-direction:column;gap:7px}
.item{display:flex;align-items:center;gap:12px;background:#fffaf0;border:3px solid var(--ink);padding:8px 10px;box-shadow:3px 3px 0 var(--paper3);text-align:left}
.item.dim{opacity:.55}
.item .ic{width:40px;height:40px;flex:0 0 40px}.item .sp{flex:0 0 96px;display:flex;justify-content:center}.item .sp img{height:auto;width:auto;max-width:96px}
.item .tx{flex:1;min-width:0}.item .tx b{font-family:'Silkscreen',monospace;font-size:13px;display:block}
.item .tx small{font-size:20px;color:#5a5340;display:block;line-height:1.05;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:21px}.kv b{color:#7a5a20}
table.mk{width:100%;border-collapse:collapse;font-size:22px}table.mk th{font-family:'Silkscreen',monospace;font-size:10px;font-weight:400;text-align:right;padding:5px 4px;border-bottom:3px solid var(--ink)}table.mk th:first-child,table.mk td:first-child{text-align:left}
table.mk td{padding:6px 4px;text-align:right;border-bottom:2px solid var(--paper3)}table.mk td.best{background:#bfe8a8}table.mk td.na{color:#b0a685}table.mk th img{width:24px;height:24px;display:block;margin:0 0 3px auto}
.news{font-size:21px;padding:6px 0;border-bottom:2px solid var(--paper3);line-height:1.05}.news small{color:#8a7a50;font-family:'Silkscreen',monospace;font-size:10px;margin-right:8px}
.news.good{color:var(--greend)}.news.bad{color:var(--redd)}.news.wx{color:var(--blued)}
.dest{font-family:'Silkscreen',monospace;font-size:11px;padding:3px 6px;border:2px solid var(--ink);background:var(--navy2);color:var(--cream);white-space:nowrap}
button.dest:hover{background:var(--blue)}
.pad h2{font-size:20px;margin:0 0 6px}
.income{background:#d6f0c8;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--paper3);padding:8px 12px;margin:0 0 10px;display:flex;align-items:center;gap:12px}
.income img{width:32px;height:32px}.income b{font-family:'Silkscreen',monospace;font-size:16px;color:var(--greend);display:block}
.eta{font-family:'Silkscreen',monospace;font-size:44px;font-weight:700;color:var(--navy);line-height:1}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
/* ---------- dock: fleet, route bar, menu ---------- */
#dock{flex:0 0 auto;display:flex;align-items:stretch;gap:10px;background:var(--navy);border-top:4px solid var(--deep);padding:8px 10px;min-height:86px}
#fleet{flex:1;display:flex;gap:8px;overflow-x:auto;min-width:0;padding:8px 2px 2px;scrollbar-width:thin;scrollbar-color:var(--navy3) transparent}
.fc{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-width:178px;height:62px;padding:4px 12px 4px 8px;background:var(--paper);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 var(--paper3);text-align:left;position:relative}
.fc:hover{background:#fff8e4}.fc.sel{background:var(--yellow);box-shadow:inset -3px -3px 0 var(--yellowd)}
.fc .spr{width:78px;height:36px;display:flex;align-items:center;justify-content:center;flex:0 0 78px}.fc .spr img{max-width:78px;max-height:36px;width:auto;height:auto}
.fc .col{display:flex;flex-direction:column;gap:2px;min-width:0}
.fc .nm{font-family:'Silkscreen',monospace;font-size:10px;white-space:nowrap;max-width:128px;overflow:hidden;text-overflow:ellipsis}
.fc .stt{font-size:21px;line-height:1;white-space:nowrap;color:#4a5566;max-width:128px;overflow:hidden;text-overflow:ellipsis}
.fc .pb{display:block;height:6px;background:var(--paper3);width:112px}.fc .pb i{display:block;height:100%;background:var(--blue);width:0}
.fc.idle::after,.fc.landed::after{position:absolute;right:-4px;top:-10px;color:#fff;font-family:'Silkscreen',monospace;font-size:10px;padding:2px 5px;border:2px solid var(--ink);animation:bob .8s steps(2) infinite}
.fc.idle::after{content:'IDLE';background:var(--red)}
.fc.landed::after{content:'LANDED';background:var(--green)}
.fc.landed{background:#d6f0c8;box-shadow:inset -3px -3px 0 #9fd08a}.fc.landed .stt{color:var(--greend)}
.fc.hold .stt{color:#c05a10}.fc.fishg .pb i{background:var(--green)}
.fc.fslot{min-width:130px;justify-content:center;background:rgba(246,233,200,.18);border:3px dashed #6f86a0;box-shadow:none;color:var(--cream);text-align:center}
.fc.fslot .col{align-items:center}.fc.fslot .nm{color:var(--sky)}.fc.fslot .stt{color:var(--cream)}
.fc.fslot.buy{background:var(--yellow);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 var(--yellowd)}.fc.fslot.buy .nm,.fc.fslot.buy .stt{color:var(--ink)}
.fc.fslot.buy[disabled]{background:#3a4c62;border-color:var(--deep);box-shadow:none;cursor:not-allowed}.fc.fslot.buy[disabled] .nm,.fc.fslot.buy[disabled] .stt{color:#9fb2c6}
#menu{flex:0 0 auto;display:flex;gap:6px;align-items:stretch;padding-top:8px}
.mbtn{width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--navy2);color:var(--cream);border:3px solid var(--deep);box-shadow:inset 3px 3px 0 var(--navy3),inset -3px -3px 0 #132337;position:relative;padding:2px}
.mbtn:hover{background:var(--navy3)}.mbtn.on{background:var(--yellow);color:var(--ink);box-shadow:inset 3px 3px 0 #fff3b0,inset -3px -3px 0 var(--yellowd)}
.mbtn img{width:32px;height:32px}.mbtn span{font-family:'Silkscreen',monospace;font-size:10px}
.mbtn .n{position:absolute;right:-4px;top:-8px;background:var(--red);color:#fff;font-family:'Silkscreen',monospace;font-size:10px;padding:1px 5px;border:2px solid var(--ink)}
#routebar{flex:1;display:none;align-items:center;gap:14px;color:var(--cream);min-width:0;padding:4px 4px}
#dock.routing #fleet,#dock.routing #menu{display:none}#dock.routing #routebar{display:flex}
#dock.routing{background:#17304e;border-top-color:var(--yellow)}
#routebar .rl{flex:1;min-width:0}
#routebar .rt{font-family:'Silkscreen',monospace;font-size:12px;color:var(--yellow);margin-bottom:5px;display:flex;align-items:center;gap:8px}
.stops{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-family:'Silkscreen',monospace;font-size:13px}
.stop{padding:5px 8px;border:3px solid var(--deep);background:var(--navy3);color:var(--cream);font-family:'Silkscreen',monospace;font-size:13px;line-height:1}
.stop.new{background:var(--yellow);color:var(--ink)}
.stops .hint{color:var(--sky);font-family:'VT323',monospace;font-size:22px;text-transform:none;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.rstats{margin-top:6px;font-size:22px;display:flex;flex-wrap:wrap;gap:2px 16px;line-height:1}
.rstats b{color:var(--yellow)}.rstats .bn{color:#7dff8a}.rstats .wn{color:#ffb08a}
#routebar .rr{display:flex;gap:8px;align-items:center}
/* ---------- ticker ---------- */
#ticker{flex:0 0 32px;height:32px;display:flex;align-items:center;gap:10px;background:var(--deep);color:var(--cream);padding:0 12px;overflow:hidden;border-top:2px solid #060d16}
#ticker b{font-family:'Silkscreen',monospace;font-size:10px;color:var(--yellow);white-space:nowrap}
#ticker img{width:24px;height:24px;flex:0 0 24px}
#tmsg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:22px}
#tmsg.in{animation:tk .35s steps(5)}@keyframes tk{from{transform:translateY(14px);opacity:0}}
#tmsg.good{color:#9af0a0}#tmsg.bad{color:#ff9a8a}#tmsg.wx{color:var(--sky)}#tmsg.season{color:var(--yellow)}
/* ---------- modal (title, start, confirm) ---------- */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(8,16,28,.74);padding:14px}
#modal.show{display:flex}
#mbox{background:var(--paper);border:4px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.45);max-width:680px;width:100%;max-height:94vh;overflow:auto;padding:22px 26px;font-size:23px;line-height:1.05}
#mbox h1{font-family:'Silkscreen',monospace;font-size:52px;line-height:.95;margin:0;color:var(--red);text-shadow:4px 4px 0 var(--yellow)}
#mbox h1 small{display:block;font-size:14px;color:var(--navy2);text-shadow:none;margin-top:8px}
#mbox h2{font-size:24px;margin:0 0 4px}
#mbox p{margin:10px 0}#mbox b{color:var(--redd)}
#mbox .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#mbox ul{margin:6px 0;padding-left:22px}#mbox li{margin:4px 0}
.titlefleet{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:14px 0 4px;padding:10px 8px 6px;background:linear-gradient(#8fd0f0 0,#bfe6fa 62%,#3682b0 62%,#2f6f9a 100%);border:4px solid var(--ink)}
.titlefleet img{height:auto}
.starts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.startc{display:flex;gap:14px;align-items:center;text-align:left;background:#fffaf0;border:4px solid var(--ink);box-shadow:inset -4px -4px 0 var(--paper3),4px 4px 0 rgba(0,0,0,.25);padding:12px 14px;width:100%;font-size:22px;line-height:1.05}
.startc:hover{background:var(--yellow)}.startc b{font-family:'Silkscreen',monospace;font-size:18px;display:block;color:var(--redd)}
.startc small{font-family:'Silkscreen',monospace;font-size:10px;display:block;color:var(--blued);margin:3px 0 5px}
.startc .sf{display:flex;gap:8px;align-items:flex-end;flex:0 0 170px;flex-wrap:wrap;justify-content:center}
/* ---------- small screens ---------- */
@media (max-width:900px){
 html,body{font-size:20px}
 #hud{height:50px;flex-basis:50px;gap:6px;padding:0 6px}#logo i{display:none}#logo b{font-size:15px}.hudbox{padding:3px 7px;height:38px;gap:5px}#money{font-size:16px;min-width:64px}#lvl{font-size:14px}#xpbar{width:54px}#xptxt{display:none}
 #date small,#daybar{display:none}#date{font-size:10px}.hbtn{height:38px;min-width:34px;font-size:11px;padding:0 6px}.hbtn.big{padding:0 8px;font-size:10px}
 #sheetwrap{padding:0}#sheet{border-width:0;box-shadow:none}
 #banner b{font-size:30px}#splash b{font-size:44px}#mbox h1{font-size:32px}#mbox{padding:14px 16px;font-size:20px}#ticker b{display:none}
 .mbtn{width:70px}.mbtn span{font-size:10px}.mbtn img{width:24px;height:24px}.fc{min-width:150px;height:54px}#dock{min-height:74px;padding:6px}
 .jtx b{font-size:21px}.jrow .btn{min-width:64px;padding:9px 8px}.jpay{font-size:15px;min-width:50px}.btn.big{font-size:17px;padding:11px 16px}
 .startc .sf{flex-basis:90px}.titlefleet img:nth-child(n+5){display:none}#routebar{flex-wrap:wrap;gap:6px}.stab{font-size:11px;padding:8px 9px 7px}
}
@media (max-width:520px){#logo,.spacer,.hbtn[data-act=help],#datebox{display:none}#hud{justify-content:space-between}#xpwrap{display:none}#menu .mbtn{width:50px}}

/* one column when there is no room for two */
@media (max-width:959px){
 #sheet{width:780px}#scols{display:block;overflow-y:auto}#sleft{display:block;border-right:none;overflow:visible;flex:none}#scenebox{height:auto;aspect-ratio:184/70;max-height:28vh}
 #sright{display:block}#sbody{overflow:visible}
}
#lbody .bev{margin-top:10px;box-shadow:4px 4px 0 var(--paper3)}
@media (max-width:900px){
 #routebar{flex-direction:column;align-items:stretch;gap:8px}#routebar .rl{flex:none}#routebar .rr{justify-content:flex-end}#routebar .rr .btn.big{flex:1}
 .stops .hint{font-size:19px}.rstats{font-size:20px}.bev{font-size:20px;padding:7px 9px;gap:9px}.bev img{width:40px;height:40px;flex-basis:40px}#bevmap{max-width:calc(100% - 70px)}
 #menu{gap:4px}
}
#scene{object-position:50% 100%}
@media (max-height:830px) and (min-width:960px){#scenebox{height:156px;flex-basis:156px}#hud{height:54px;flex-basis:54px}#dock{min-height:78px;padding:6px 10px}.fc{height:56px}}

/* ===== nothing gets cut off: wrap or scroll instead of truncating ===== */
#shead h2,#shead .sub2,.jtx b,.holdbar .hh b{white-space:normal;overflow:visible;text-overflow:clip}
.jtx>span{flex-wrap:wrap;white-space:normal;overflow:visible;row-gap:2px}
.craftbar{flex-wrap:wrap;overflow:visible;padding-bottom:0}
.cyc,.ft-bev{display:none}
.fc{min-width:0;height:auto;min-height:62px}
.fc .nm,.fc .stt{max-width:none;overflow:visible;text-overflow:clip}
.fc .stt{display:flex;align-items:center;gap:6px}
.fc.idle::after,.fc.landed::after{content:none}
.ftag{font-style:normal;font-family:'Silkscreen',monospace;font-size:10px;padding:2px 5px;border:2px solid var(--ink);color:#fff;line-height:1}
.ftag.r{background:var(--red)}.ftag.g{background:var(--green)}.ftag.o{background:var(--orange)}.ftag.b{background:var(--blue)}
.ftime{font-style:normal;font-family:'Silkscreen',monospace;font-size:13px;color:var(--blued)}
.fc .pb{width:100%;min-width:96px}
.fc.fslot{min-width:120px}
#fleet{padding:2px;align-items:stretch}
#menu{padding-top:0}
.mbtn span{white-space:nowrap}
#tmsg{text-overflow:clip}
#tmi{display:inline-block;white-space:nowrap}
#tmi.scroll{animation:mq var(--d,8s) linear infinite alternate}
@keyframes mq{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(var(--ov,0))}}

/* ===== phones: the port screen fills the display and the job list is on screen straight away ===== */
@media (max-width:700px){
 html,body{font-size:19px}
 #hud{height:48px;flex:0 0 48px;gap:6px;padding:0 6px;justify-content:space-between}

h3{font-size:13px}.tag{font-size:11px}.item .tx b{font-size:14px}
.fc .nm{font-size:11px}
.holdbar .bn.hint{display:none}

.seg i{font-style:normal;background:var(--red);color:#fff;font-size:10px;padding:1px 5px;margin-left:6px;border:2px solid var(--ink)}
.item .tx .pps{display:flex;margin:5px 0 0}
.pp.this{outline:3px solid var(--blue);outline-offset:1px}
.pick .craftbar{display:flex !important;margin-bottom:6px}
#sfoot .grow:empty{display:none}

/* ===== v10: the guided tutorial ===== */
#bevmap{display:none}
#coach{position:fixed;inset:0;z-index:35;pointer-events:none;display:none}#coach.on{display:block}
#coachring{position:fixed;display:none;border:4px solid var(--yellow);animation:cring .5s steps(2) infinite}
#coachring.on{display:block;box-shadow:0 0 0 3px var(--ink)}
#coachring.spot{box-shadow:0 0 0 3px var(--ink),0 0 0 4000px rgba(8,16,28,.55)}
@keyframes cring{50%{border-color:#fff}}
#coachbub{position:fixed;display:flex;gap:10px;align-items:flex-start;width:min(350px,calc(100vw - 16px));background:#fffaf0;border:4px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.4);padding:10px 12px;font-size:23px;line-height:1.05;color:var(--ink)}
#coachbub img{width:48px;height:48px;flex:0 0 48px;border:3px solid var(--ink);background:var(--sky);image-rendering:pixelated}
#coachbub .cb{flex:1;min-width:0}#coachbub b{display:block;font-family:'Silkscreen',monospace;font-size:10px;color:var(--redd);margin-bottom:4px}
#coachbub p{margin:0}
.cbrow{display:flex;align-items:center;gap:10px;margin-top:8px}
#coachbub button{pointer-events:auto}
.cskip{margin-left:auto;background:none;border:0;font-family:'Silkscreen',monospace;font-size:10px;color:#7a6f55;text-decoration:underline;padding:8px 2px;cursor:pointer}
#coachbub .tip{position:absolute;width:0;height:0;border:12px solid transparent}
#coachbub .tip.dn{bottom:-26px;border-top-color:var(--ink)}#coachbub .tip.up{top:-26px;border-bottom-color:var(--ink)}#coachbub .tip.off{display:none}
@media (max-width:700px){ #coachbub{font-size:21px;padding:8px 10px;gap:8px;width:min(330px,calc(100vw - 12px))}#coachbub img{width:40px;height:40px;flex-basis:40px} }
.cbh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}#coachbub .cbh b{margin:0}
.cskip{margin:0;padding:6px 2px 6px 10px;font-size:10px}

/* ===== v12: things that unlock with levels ===== */
.card.unl{margin:8px 0;padding:8px 10px}.card.unl b{font-size:12px;color:var(--greend)}.card.unl .sub{margin-top:4px}.card.unl .fnd{color:var(--blued,#2a5d9a)}
.bar.red i{background:var(--red)}.bar.amber i{background:var(--yellowd,#c99a1c)}
.nmin{flex:1;min-width:0;font-family:'VT323',monospace;font-size:24px;padding:6px 8px;border:3px solid var(--ink);background:#fff;color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{display:flex;align-items:center;gap:6px;font-family:'Silkscreen',monospace;font-size:10px;padding:7px 8px;background:var(--paper2);border:3px solid var(--ink);color:var(--ink)}
.sw i{width:16px;height:16px;border:2px solid var(--ink);display:block}.sw.on{background:var(--yellow)}
.code{display:block;width:100%;height:74px;margin-top:8px;font-family:monospace;font-size:11px;padding:6px;border:3px solid var(--ink);background:#fff;color:var(--ink);resize:none;word-break:break-all}
.fc .wr{width:10px;height:10px;image-rendering:pixelated;vertical-align:middle}
.jtx .tag{align-self:flex-start;margin-top:3px}
#mbox .card.unl .sub{font-size:20px}

/* VIPs and holidays */
.tag.gold{background:#ffd23f;border-color:#8a6a12;color:#3a2a06;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tag.gold2{background:#fffaf0;border-color:#a87a10;color:#6a4a06;white-space:nowrap}
.jtx .tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;align-self:flex-start}.jtx .tags .tag{margin-top:0}
.tag.hol{background:var(--red);color:#fff}
.jrow.vip,.dg .jrow.vip{background:#fff1b8;border-color:#a87a10;box-shadow:inset 0 0 0 2px #ffd23f}

/* goods */
.jrow .btn.buy{background:var(--yellow);color:var(--ink);box-shadow:inset -3px -3px 0 #b88a1c,inset 3px 3px 0 #ffe89a}
.jrow .btn.buy[disabled]{background:#cfc5a8;color:#8a8168;box-shadow:inset -3px -3px 0 #b8ad8c}
/* tags on a job row are small chips, not bars across the row */
.jtx>span.tag{display:inline-block;font-size:11px;color:var(--ink);margin-top:3px;overflow:visible}
.jtx>span.tag.red,.jtx>span.tag.hol,.jtx>span.tag.blue,.jtx>span.tag.green,.jtx>span.tag.org{color:#fff}

/* ---------- the craft card: a big picture, a name, seats and cargo counted plainly, and slots large enough to read ---------- */

.holdbar.v2.plain{border-color:var(--ink)}

.holdbar.v2 .slots.mini .slot span{display:inline;position:static;font-size:11px}
.holdbar.v2 .slots .slot.cnt{width:auto;min-width:0;flex-direction:row;align-items:center;justify-content:center;gap:5px;padding:0 7px}

.holdbar.v2.lg .cbot .slots{display:contents}

@media (max-width:375px){.holdbar.v2.lg .cpic{flex-basis:26%}.holdbar.v2.lg .cap b{font-size:14px}.holdbar.v2.lg .cap img{width:15px;height:15px}}
.holdbar.v2 .bn{font-size:18px;margin-top:6px}
@media (min-width:800px){

/* ---------- contracts ---------- */
function makeOffer(tp) {
  const o = PORT_BY[tp.from], d = PORT_BY[tp.to], dist = Math.hypot(d.x - o.x, d.y - o.y); let cap = 0, speed = 3;

  const rate = Math.round((14 + 0.9 * dist) * 1.2 * ((has(o, 'island') || has(d, 'island') || has(d, 'remote')) ? 1.25 : 1) / 5) * 5;
  return { id: G.nextId++, title: tp.title, text: tp.text, what: tp.what, ic: tp.ic, from: tp.from, to: tp.to, k: tp.k, total, delivered: 0, loaded: 0, rate, bonus: Math.max(100, Math.round(total * rate * 0.6 / 50) * 50), dur, deadline: 0, born: G.t, s: tp.s, canDo: cap > 0 };

  const pool = CONTRACT_TEMPLATES.filter(t => t.s === s && !taken[t.title] && G.ports[t.from].open && G.ports[t.to].open);
  while (G.offers.length < 3 && pool.length) { const i = (Math.random() * pool.length) | 0; G.offers.push(makeOffer(pool.splice(i, 1)[0])); }
  SIM.dirty = true;
}

function updateContracts(dt) { if (SIM.away) { G.active.forEach(k => { k.deadline += dt || 0; }); return; } for (let i = G.active.length - 1; i >= 0; i--) if (G.t > G.active[i].deadline) dropContract(G.active[i], true); }

/* ---------- the tick ---------- */
function tick(dt) {

  const d = dayOf(G.t);
  if (d !== G.lastDay) { G.lastDay = d; const s = season(); refreshOffers(); rollEvent(); refreshHall(); emit('day', {});
    if (s !== s0) { news(SEASON_NAMES[s] + ', year ' + yearOf(G.t) + '. ' + SEASON_BLURB[s], 'season'); emit('season', { s }); G.offers = []; refreshOffers(); }
    else if ((d % SEASON_DAYS) === SEASON_DAYS - 1) { const nx = (s + 1) % 4; news('Almanac: ' + SEASON_NAMES[nx].toLowerCase() + ' starts tomorrow. ' + (nx === WINTER ? 'Lakes will freeze; floats are no good on ice.' : nx === SPRING ? 'Mud season closes grass and gravel strips.' : nx === SUMMER ? 'The summer people are coming.' : 'Foliage, hunters and potatoes.'), 'season'); } }

}

/* ===== Depth: goods with supply and demand, port requests, a rival, craft fits and crew that improve =====
   The point of all of it is choices that cost something: what to carry where and when to stop, which ports to
   look after, what to grab before somebody else does, and what one craft should be good at. */

/* ---------- goods ---------- */
// A port either makes a good, wants it, or neither. A good is cheap where it is made and gains GOOD_KM dollars for every
// kilometre you carry it from where you bought it, and a third more again where it is wanted. A port that makes it pays no more
// than its own price. Every unit you buy pushes the price up there; every unit you sell pushes it down.
// (It used to be priced by how far the nearest maker was, so a long haul toward another maker paid nothing, and the margin was a
// fifth to a half of a job's pay on the same run. Now a full hold of goods is worth about half what jobs would be.)
const GOODS = [
  { id: 'wares',   name: 'City wares',     base: 55, ic: 'crate',   from: p => has(p, 'city') && !has(p, 'customs'),          want: p => has(p, 'island') || has(p, 'remote') || has(p, 'camp') || has(p, 'woods') },
  { id: 'seafood', name: 'Packed seafood', base: 90, ic: 'cooler',  from: p => has(p, 'lobster') || has(p, 'scallop') || p.id === 'rkd',         want: p => has(p, 'city') || !p.water },
  { id: 'lumber',  name: 'Lumber',         base: 42, ic: 'lumber',  from: p => has(p, 'woods') && !has(p, 'ski'),              want: p => has(p, 'island') || has(p, 'city') },
  { id: 'potato',  name: 'Potatoes',       base: 30, ic: 'potato',  from: p => has(p, 'potato'),                               want: p => has(p, 'city') || has(p, 'island') },
  { id: 'berry',   name: 'Blueberries',    base: 48, ic: 'berries', from: p => has(p, 'downeast'),                             want: p => has(p, 'city') || has(p, 'tourist') },
  { id: 'syrup',   name: 'Maple syrup',    base: 70, ic: 'syrup',   from: p => has(p, 'leaf') && !has(p, 'city'),              want: p => has(p, 'city') || has(p, 'tourist') || has(p, 'island') },
  { id: 'cheese',  name: 'Cheese',         base: 80, ic: 'box',     from: p => p.reg === 'Vermont',                            want: p => has(p, 'city') || has(p, 'tourist') || has(p, 'island') },
  { id: 'cran',    name: 'Cranberries',    base: 44, ic: 'berries', from: p => p.reg === 'Cape & Islands' || p.id === 'ewb',   want: p => has(p, 'city') }

const GOOD_BY = {}; GOODS.forEach(g => { GOOD_BY[g.id] = g; });
const goodMakes = (p, g) => !!g.from(p), goodWants = (p, g) => !g.from(p) && !!g.want(p);

function bumpGlut(pid, gid, d) { const m = G.gg || (G.gg = {}), k = pid + ':' + gid; m[k] = clamp((m[k] || 0) + d, -0.3, 0.45); }

  return Math.max(5, Math.round(v * (1 - goodGlut(pid, gid)))); }

function goodsCount(c) { let n = 0; (c.goods || []).forEach(q => { n += q.n; }); return n; }
// what the lots of one good aboard would bring here right now, each priced by where it came from
function goodQuote(c, gid, pid) { let n = 0, rev = 0, cost = 0; (c.goods || []).forEach(q => { if (q.g !== gid) return; n += q.n; cost += q.cost; rev += q.n * goodPrice(pid, gid, q.from); }); return { n, cost, each: n ? Math.round(rev / n) : 0, paid: n ? Math.round(cost / n) : 0 }; }
// the best price among your ports this craft could plausibly carry it to, bought here
function bestMarket(c, gid, fromId) { const T = CRAFT_BY[c.type], here = PORT_BY[c.at], rng = cstat(c).range; let best = null; if (!here) return null;
  PORTS.forEach(p => { if (p.id === c.at || !G.ports[p.id].open || landWhy(T, c.upg, p, season()) || Math.hypot(p.x - here.x, p.y - here.y) > rng) return; const pr = goodPrice(p.id, gid, fromId || c.at); if (!best || pr > best.price) best = { pid: p.id, name: p.name, price: pr }; }); return best; }

/* ---------- requests: a port asks for something ---------- */

function reqFor(pid, gid) { return (G.reqs || []).find(r => r.pid === pid && r.g === gid && G.t < r.until); }

function updateRequests(dt) { const L = G.reqs || (G.reqs = []); if (SIM.away) { L.forEach(r => { r.until += dt || 0; }); if (G.reqNext !== undefined) G.reqNext += dt || 0; return; }

/* ---------- a rival ---------- */

const RIVAL = 'Quoddy Air & Freight', RIVAL_WAIT = 80;
function updateRival(dt) {

    if (n) { G.stats.lost = (G.stats.lost || 0) + n; news(RIVAL + ' took ' + n + (n === 1 ? ' job' : ' jobs') + ' out of ' + p.name + ' for ' + PORT_BY[to].name + '.', 'bad'); emit('rival', { pid: p.id, to, n, took: true }); SIM.dirty = true; } });

const FITS = {
  range:  { n: 'Long-range tanks',     d: 'Half again the range. One cargo slot less.',     range: 1.5, cargo: -1 },

};
function fitsFor(c) { const T = CRAFT_BY[c.type]; return Object.keys(FITS).filter(k => !FITS[k].need || FITS[k].need(T)); }
function fitCost(c) { return Math.max(100, Math.round(CRAFT_BY[c.type].price * 0.06 / 50) * 50); }
function setFit(c, id) { const T = CRAFT_BY[c.type]; if (!feat('fits')) return 'Fits unlock at level ' + FEATURE_BY.fits.lvl + '.'; if (c.state !== 'dock' || !hasYard(c.at, T)) return 'Fits are done at a ' + yardWord(T) + '.';
  if (c.jobs.length || goodsCount(c) || c.fish) return 'Empty it first.'; id = id || ''; if ((c.fit || '') === id) return 'Already set up that way.'; if (id && fitsFor(c).indexOf(id) < 0) return 'That does not suit it.';

// A hand who has made twenty trips with a craft is seasoned, sixty an old hand. Each step is 4% on every fare. Let them go and it goes with them.
const CREW_RANKS = ['New hand', 'Seasoned', 'Old hand'];
function crewRank(c) { const t = c.crew ? (c.crew.trips || 0) : 0; return t >= 60 ? 2 : t >= 20 ? 1 : 0; }
function crewFare(c) { return 1 + 0.04 * crewRank(c); }

function updateDepth(dt) { const m = G.gg; if (m) { const k = Math.exp(-dt / 700); for (const id in m) { m[id] *= k; if (Math.abs(m[id]) < 0.004) delete m[id]; } } updateRequests(dt); updateRival(dt); }

function capPips(c) { const T = CRAFT_BY[c.type], cs = cstat(c), ld = loadOf(c); if (T.tour) return '<span class="pips"><i class="pt">' + T.tour + '</i></span>';

  let h = '<span class="pips">'; for (let i = 0; i < cs.pax; i++) h += '<i class="pp p' + (i < ld.pax ? ' on' : '') + '"></i>'; for (let i = 0; i < cs.cargo; i++) h += '<i class="pp c' + (i < ld.cargo ? ' on' : '') + '"></i>'; return h + '</span>'; }

/* =====================================================================
   Section 7: MAIN  — boot and the frame loop
   ===================================================================== */
const STORE = (function () { try { const k = '__fk_test'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return localStorage; } catch (e) { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; } })();
// The sim runs on the wall clock, one second per second. If the tab was hidden or the game was closed,
// the gap is replayed in coarse steps so flights land and job boards turn over while you were away.
// One bad frame must never freeze the game: report the error, back out to the map, and keep going.
function frame(now) { try { frameBody(now); UI.badFrames = 0; } catch (e) { setTimeout(() => { throw e; }); if ((UI.badFrames = (UI.badFrames || 0) + 1) < 4) { try { deselect(); } catch (x) {} } requestAnimationFrame(frame); } }
// The game clock is the wall clock: whatever real time has passed since the sim last moved is played now.
// This runs every frame and before every save. A browser stops drawing frames when the tab is hidden or the window is
// covered, but it still fires the autosave timer and the visibility event, and a save stamps the time. Catching up
// first means that stamp never throws away the time spent hidden.
// A long absence is caught up a slice at a time, behind a note that says so, instead of freezing the page: twelve hours of a
// big game is one to two seconds of work on a desktop and several on a phone. While the page is hidden nobody is watching,
// so it is done in one go. Port requests and the rival stand still for all of it (awayTick).
const CATCH_MIN = 120, CATCH_BUDGET = 20;      // seconds away before the catch-up is spread out; milliseconds of it done per frame
const landedNow = () => G.crafts.filter(c => c.state === 'landed').length;
function catchStep(all) { const cu = UI.catchUp, t0 = performance.now(); if (!cu) return;
  while (cu.left > 0 && (all || performance.now() - t0 < CATCH_BUDGET)) { const dt = Math.min(2, cu.left); awayTick(dt); cu.left -= dt; }
  SIM.events = []; const box = $('catchup');
  if (cu.left > 0) { box.classList.add('on'); $('catchbar').style.width = Math.round(100 * (1 - cu.left / cu.total)) + '%'; $('catchtxt').textContent = 'Playing out the ' + secs(cu.total) + ' you were away'; return; }
  UI.catchUp = null; box.classList.remove('on'); SIM.dirty = true; UI.away = (UI.away || 0) + cu.total; UI.awayLanded = (UI.awayLanded || 0) + Math.max(0, landedNow() - cu.landed); UI.fleetKey = ''; forcePanel(); }
function advance() {
  if (!UI.started || UI.paused) return; const wall = Date.now(), el = (wall - G.wall) / 1000; G.wall = wall;
  if (UI.catchUp) { UI.catchUp.left = Math.min(OFFLINE_CAP, UI.catchUp.left + Math.max(0, el)); catchStep(document.hidden); }
  else if (el > CATCH_MIN && !document.hidden) { const sec = Math.min(el, OFFLINE_CAP); UI.catchUp = { left: sec, total: sec, landed: landedNow() }; catchStep(false); }
  else if (el > 3) { const landed = fastForward(el); UI.away = (UI.away || 0) + el; UI.awayLanded = (UI.awayLanded || 0) + landed; UI.fleetKey = ''; forcePanel(); }
  else if (el > 0) tick(el);
  if (UI.away && !UI.catchUp && !document.hidden) { if (UI.away > 45) awayNote(UI.away, UI.awayLanded); UI.away = 0; UI.awayLanded = 0; }
}
function frameBody(now) {
  advance();
  if (UI.started && !UI.greeted && G.tutDone && UI.screen === 'map' && !$('modal').classList.contains('show')) { UI.greeted = 1; const hd = holidayGreet(); if (hd) banner(hd.name, 'Holiday jobs pay 25% more this week.'); }
  refreshSel();
  const c = UI.selCraft; if (UI.screen === 'route' && (!c || c.state !== 'dock')) deselect();
  if ((UI.screen === 'route') !== !!UI.reach) computeReach();
  handleEvents(); drawMap(now, UI); renderFleet(); renderPanel(now); updateLive(now); renderCoach();
  requestAnimationFrame(frame);
}
function boot() {
  buildArt(); initWorld();
  VIEW.canvas = $('map'); layout();
  UI.hasSave = loadGame(STORE); if (!UI.hasSave) { UI.badSave = keepUnreadable(STORE); newGame('casco'); } startView();
  UI.shownMoney = G.money; SIM.events = []; $('coinic').src = ICON_URL.coin; $('mi1').src = ICON_URL.paper; $('mi2').src = ICON_URL.fish_lobster; $('mi3').src = ICON_URL.books; $('mi4').src = ICON_URL.ui_wrench;
  initInput(); showTitle(false); if (G.news[0]) showNews(G.news[0]);
  // "save" action and autosave share the same store
  // a save finishes any catch-up first, so the time stamp it writes is true; and says so, once, if the browser will not keep it
  const doSave = () => { if (!UI.started) return; advance(); if (UI.catchUp) catchStep(true); const ok = saveGame(STORE);
    if (!ok && !UI.saveWarned) { UI.saveWarned = 1; toast('This browser is not keeping the save: storage is full or switched off. SAVE TO A FILE in the Almanac still works.', 'bad'); } else if (ok) UI.saveWarned = 0; };
  setInterval(doSave, 15000); document.addEventListener('visibilitychange', doSave); window.addEventListener('pagehide', doSave);
  requestAnimationFrame(frame);
  // installed from the site, the game keeps a copy of itself so it opens with no connection
  try { if ('serviceWorker' in navigator && ((location.protocol === 'https:' && /github\.io$/.test(location.hostname)) || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
